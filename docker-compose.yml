version: '3.8'

services:
  # 1. PostgreSQL Database Service with pgvector Extension
  db:
    image: pgvector/pgvector:pg16
    container_name: candidate_pgvector_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: candidate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candidate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Application Service
  web:
    build: .
    container_name: candidate_fastapi_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/candidate_db
      - GEMINI_API_KEY=mock-gemini-key-for-testing
      - USE_MOCK_LLM=True
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
